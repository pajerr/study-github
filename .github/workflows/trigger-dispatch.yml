name: Trigger Repository Dispatch

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: 'Event type to trigger'
        required: true
        default: 'run-tests'
        type: choice
        options:
          - run-tests
          - deploy
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger repository_dispatch
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"${{ inputs.event_type }}","client_payload":{"env":"${{ inputs.environment }}"}}'

      - name: Confirmation
        run: |
          echo "✅ Triggered repository_dispatch event!"
          echo "Event type: ${{ inputs.event_type }}"
          echo "Environment: ${{ inputs.environment }}"
