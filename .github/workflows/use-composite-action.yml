name: Use Composite Action

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name to greet'
        required: true
        default: 'Composite User'

jobs:
  call-composite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use composite action
        uses: ./.github/actions/hello-composite
        with:
          who: ${{ inputs.name }}
