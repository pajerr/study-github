name: Matrix Build Example

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-20.04]
        node-version: [16.x, 18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Display environment info
        run: |
          echo "Running on: ${{ matrix.os }}"
          echo "Node version: ${{ matrix.node-version }}"
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --legacy-peer-deps || echo "No package.json found"

      - name: Run build simulation
        run: |
          echo "Building on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
          echo "Build successful!"

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-20.04]
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test simulation
        run: |
          echo "Testing on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
          echo "All tests passed!"
